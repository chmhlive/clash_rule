name: Weekly Clash Rule Merge Sync

on:
  schedule:
    # 每周一 00:00 UTC (北京时间 周一 08:00) 自动触发运行
    - cron: '0 0 * * 1'
  workflow_dispatch: # 支持在 GitHub Actions 页面手动点击按钮随时触发更新

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run rule merge script
        run: |
          python scripts/merge_rules.py

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add rules/
          if git diff --staged --quiet; then
            echo "没有规则更新，跳过 Commit。"
          else
            git commit -m "chore(sync): 自动合并更新 Clash 规则 [周度例行更新]"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" HEAD:main
          fi

      - name: Purge jsDelivr CDN Cache
        run: |
          echo "===> 正在并发 (10 线程) 刷新 rules/ 目录下所有 .yaml 规则文件的 jsDelivr CDN 全球缓存..."
          find rules/ -type f -name "*.yaml" | xargs -n 1 -P 10 -I {} sh -c 'curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/{}" > /dev/null || true'
          echo "===> 所有 .yaml 规则文件的 CDN 缓存刷新请求已全部并发完成！"



